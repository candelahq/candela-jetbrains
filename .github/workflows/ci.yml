# Candela JetBrains — CI Pipeline
#
# Jobs:
#   lint           — ktlint + detekt (parallel, ~30s)
#   unit-test      — JUnit 5 unit tests, no IDE sandbox (parallel, ~30s)
#   build          — plugin build & verification (after lint + unit-test)
#
# Platform tests (BasePlatformTestCase) are NOT run in CI because the IDE
# sandbox tearDown is too slow on GitHub Actions (~10 min between tests).
# Run them locally: `make platform-test` or via IntelliJ IDE test runner.
#
# Mirrors the CI patterns from the main candela repo.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-flight runs for the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck
      - name: Static analysis (detekt)
        run: ./gradlew detekt

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests (JUnit 5)
        run: >-
          ./gradlew test
          --tests "com.candelahq.candela.BackoffTest"
          --tests "com.candelahq.candela.BuildCodeFenceTest"
          --tests "com.candelahq.candela.CodeContextTest"
          --tests "com.candelahq.candela.CoroutineScopeLifecycleTest"
          --tests "com.candelahq.candela.StatusBar*"
          --tests "com.candelahq.candela.Stream*"
          --tests "com.candelahq.candela.actions.ActionsTest"
          --tests "com.candelahq.candela.chat.AdaptiveThrottleTest"
          --tests "com.candelahq.candela.chat.ChatDatabaseTest"
          --tests "com.candelahq.candela.chat.ChatSessionTest"
          --tests "com.candelahq.candela.chat.MarkdownRendererTest"
          --tests "com.candelahq.candela.chat.SelectionContextTest"
          --tests "com.candelahq.candela.client.*"

  build:
    name: Build
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: ./gradlew buildPlugin
      - name: Verify plugin compatibility
        continue-on-error: true
        run: ./gradlew verifyPlugin
