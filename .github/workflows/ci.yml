# Candela JetBrains — CI Pipeline
#
# Jobs:
#   lint           — ktlint + detekt (parallel, ~30s)
#   unit-test      — JUnit 5 unit tests, no IDE sandbox (parallel, ~30s)
#   platform-test  — JUnit 3 platform tests, full IDE sandbox (parallel, ~5m)
#   build          — plugin build & verification (after all pass)
#
# Mirrors the CI patterns from the main candela repo.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-flight runs for the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck
      - name: Static analysis (detekt)
        run: ./gradlew detekt

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests (JUnit 5)
        run: >-
          ./gradlew test
          --tests "com.candelahq.candela.BackoffTest"
          --tests "com.candelahq.candela.BuildCodeFenceTest"
          --tests "com.candelahq.candela.CodeContextTest"
          --tests "com.candelahq.candela.CoroutineScopeLifecycleTest"
          --tests "com.candelahq.candela.StatusBar*"
          --tests "com.candelahq.candela.Stream*"
          --tests "com.candelahq.candela.actions.ActionsTest"
          --tests "com.candelahq.candela.chat.*Test"
          --tests "com.candelahq.candela.client.*"

  platform-test:
    name: Platform Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run platform tests (JUnit 3 / IDE sandbox)
        run: >-
          ./gradlew test --info
          --tests "com.candelahq.candela.settings.CandleSettingsPlatformTest"
          --tests "com.candelahq.candela.actions.CodeContextPlatformTest"
          --tests "com.candelahq.candela.actions.ActionUpdatePlatformTest"

  build:
    name: Build
    needs: [lint, unit-test, platform-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: ./gradlew buildPlugin
      - name: Verify plugin compatibility
        continue-on-error: true
        run: ./gradlew verifyPlugin
